<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUD Visa Analayzer</title>
    <!-- استدعاء مكتبة SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- استدعاء ملف التصميم -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>SUD Visa Analayzer</h2>

        <div class="input-group">
            <label for="excelFile"><strong>1. اختر ملف الإكسل:</strong></label>
            <br><br>
            <input type="file" id="excelFile" accept=".xlsx, .xls">

            <label for="accountSelect"><strong>2. اختر رقم الحساب:</strong></label>
            <br><br>
            <select id="accountSelect">
                <option value="13301">13301 - جدة</option>
                <option value="13302">13302 - تبوك</option>
                <option value="13304">13304 - القصر مول</option>
                <option value="13305">13305 - الأندلس</option>
                <option value="13306">13306 - يو وك</option>
            </select>

            <button id="analyze">تحليل البيانات</button>
            <div id="errorMsg" class="error"></div>
        </div>

        <div id="results"></div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
